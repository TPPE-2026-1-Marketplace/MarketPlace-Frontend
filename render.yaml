services:
  - type: web
    name: dk-fashion-web-image
    # Imagem nginx publicada no GHCR pelo workflow de CD (.github/workflows/cd.yml).
    # O deploy é disparado pelo CD via API do Render (por digest), após o CI
    # verde na main — deixe o auto-deploy desligado no painel.
    runtime: image
    plan: free
    image:
      url: ghcr.io/tppe-2026-1-marketplace/marketplace-frontend:latest
      creds:
        fromRegistryCreds:
          name: github-container-registry
    # O fallback de SPA (React Router) é feito pelo nginx (nginx.conf), e a
    # VITE_API_URL é embutida em build time pelo CD (variável VITE_API_URL do
    # environment `production` no GitHub) — nada a configurar aqui.
    healthCheckPath: /healthz
