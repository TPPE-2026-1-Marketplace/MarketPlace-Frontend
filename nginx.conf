server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck do container, do Render e do smoke test do CD.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Assets gerados pelo Vite têm hash no nome: podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca deve ser cacheado, senão o navegador fica preso em um
    # deploy antigo apontando para assets que não existem mais.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router (SPA): toda rota desconhecida cai no index.html
    # (senão /pedido, /produtos/:id etc. dão 404 ao recarregar).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
