services:
  app:
    # Mesma imagem publicada pelo CD no GHCR. `make prod-build` gera localmente.
    image: ghcr.io/tppe-2026-1-marketplace/marketplace-frontend:${TAG:-latest}
    build:
      context: .
      target: runner
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "${APP_PORT:-3003}:80"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
