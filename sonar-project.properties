sonar.organization=tppe-2026-1-marketplace
sonar.projectKey=TPPE-2026-1-Marketplace_MarketPlace-Frontend
sonar.projectName=MarketPlace-Frontend

sonar.sources=src
sonar.exclusions=**/*.test.*,**/tests/**,src/test/**
sonar.sourceEncoding=UTF-8

# Testes de unidade (Vitest): arquivos *.test.ts(x) ao lado do código.
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Gerados por `pnpm test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/sonar-report.xml

# Componentes de biblioteca (shadcn/Radix) e bootstrap da aplicação ficam fora
# da cobertura; o mesmo recorte está em vitest.config.ts.
sonar.coverage.exclusions=src/components/ui/**,src/main.tsx,**/*.d.ts
